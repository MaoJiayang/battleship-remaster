<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI对战可视化 - 海战棋</title>
  <link rel="stylesheet" href="visualizer.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 AI对战可视化</h1>
      <button id="back-btn" onclick="window.close()">← 返回网格搜索</button>
    </header>

    <!-- 配置面板 -->
    <div class="config-panel">
      <div class="ai-config">
        <h3>AI-A（先手/红方）</h3>
        <div class="config-row">
          <label>Alpha:</label>
          <input type="number" id="alpha-a" step="0.05" min="0" max="1" value="0.7">
        </div>
        <div class="config-row">
          <label>Risk:</label>
          <input type="number" id="risk-a" step="0.05" min="0" max="1" value="0.2">
        </div>
      </div>

      <div class="ai-config">
        <h3>AI-B（后手/蓝方）</h3>
        <div class="config-row">
          <label>Alpha:</label>
          <input type="number" id="alpha-b" step="0.05" min="0" max="1" value="0.6">
        </div>
        <div class="config-row">
          <label>Risk:</label>
          <input type="number" id="risk-b" step="0.05" min="0" max="1" value="0.3">
        </div>
      </div>

      <div class="control-config">
        <div class="config-row">
          <label>回合间隔 (ms):</label>
          <input type="number" id="turn-delay" min="0" max="5000" step="100" value="800">
        </div>
        <div class="button-group">
          <button id="start-battle-btn" class="btn-primary">▶️ 开始对战</button>
          <button id="pause-battle-btn" class="btn-secondary" disabled>⏸️ 暂停</button>
          <button id="resume-battle-btn" class="btn-secondary" disabled>▶️ 继续</button>
          <button id="reset-battle-btn" class="btn-secondary">🔄 重置</button>
        </div>
      </div>
    </div>

    <!-- 战场显示 -->
    <div class="battlefield">
      <!-- AI-A 舰队 -->
      <div class="fleet-panel red-fleet">
        <div class="fleet-header">
          <h2>AI-A 舰队</h2>
          <div class="fleet-status">
            <span id="status-a">等待部署</span>
            <div id="ships-a" class="ship-list"></div>
          </div>
          <button id="toggle-prob-a" class="btn-secondary" style="margin-top: 10px; width: 100%;">🎯 概率: 关闭</button>
        </div>
        <div id="grid-a" class="battle-grid"></div>
      </div>

      <!-- AI-B 舰队 -->
      <div class="fleet-panel blue-fleet">
        <div class="fleet-header">
          <h2>AI-B 舰队</h2>
          <div class="fleet-status">
            <span id="status-b">等待部署</span>
            <div id="ships-b" class="ship-list"></div>
          </div>
          <button id="toggle-prob-b" class="btn-secondary" style="margin-top: 10px; width: 100%;">🎯 概率: 关闭</button>
        </div>
        <div id="grid-b" class="battle-grid"></div>
      </div>
    </div>

    <!-- 战况日志 -->
    <div class="battle-log-panel">
      <h3>📋 战况日志</h3>
      <div id="battle-log" class="battle-log"></div>
    </div>

    <!-- 对战结果模态框 -->
    <div id="result-modal" class="modal">
      <div class="modal-content">
        <h2 id="result-title"></h2>
        <div id="result-stats"></div>
        <button id="close-result-btn" class="btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <script type="module" src="visualizer-main.js"></script>
</body>
</html>
